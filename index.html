<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu Uygulaması</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌤️ Hava Durumu Uygulaması</h1>
        
        <form id="weatherForm">
            <input type="text" id="cityInput" placeholder="Bir şehir giriniz" required>
            <button type="submit" id="searchBtn">Hava Durumunu Getir</button>
        </form>

        <div id="result">
            <p class="placeholder-text">Hava durumu verileri burada görünecek.</p>
        </div>
    </div>

    <script src="jquery-3.7.1.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
